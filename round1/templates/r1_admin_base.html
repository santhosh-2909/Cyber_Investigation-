<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Admin - Cyber Puzzle{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/design-system.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/pages.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="admin-brand">
        <div class="topnav-brand-icon">R1</div>
        <div>
          <div class="topnav-brand-text" style="color:var(--text-primary);">CYBER<span>PUZZLE</span></div>
          <div class="font-overline text-accent" style="margin-top:4px;">ADMIN CONSOLE</div>
        </div>
      </div>

      <nav class="admin-nav">
        <a href="{{ url_for('r1.r1_admin_dashboard') }}" class="admin-nav-item {% if request.endpoint == 'r1.r1_admin_dashboard' %}active{% endif %}">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          Overview
        </a>
        <div class="admin-nav-item-wrap {% if request.endpoint == 'admin_team_logins' %}active{% endif %}">
          <a href="{{ url_for('admin_team_logins', round_name='round1') }}" class="admin-nav-item">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            Team Login
          </a>
          <a href="{{ url_for('admin_team_logins', round_name='round1') }}#add-team" class="admin-nav-add" title="Add team manually">+</a>
        </div>
        <a href="{{ url_for('admin_team_logins', round_name='round1') }}" class="admin-nav-sub {% if request.endpoint == 'admin_team_logins' and request.view_args.get('round_name') == 'round1' %}active{% endif %}">ROUND 1 · TEAM ID</a>
        <a href="{{ url_for('admin_team_logins', round_name='round2') }}" class="admin-nav-sub {% if request.endpoint == 'admin_team_logins' and request.view_args.get('round_name') == 'round2' %}active{% endif %}">ROUND 2 · ACCESS ID</a>
        <a href="{{ url_for('r1.r1_admin_sessions') }}" class="admin-nav-item {% if request.endpoint == 'r1.r1_admin_sessions' %}active{% endif %}">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          Sessions
        </a>
        <a href="{{ url_for('r1.r1_admin_submissions') }}" class="admin-nav-item {% if request.endpoint == 'r1.r1_admin_submissions' %}active{% endif %}">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          Submissions
        </a>
        <a href="{{ url_for('r1.r1_admin_statistics') }}" class="admin-nav-item {% if request.endpoint == 'r1.r1_admin_statistics' %}active{% endif %}">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
          Statistics
        </a>
        <a href="{{ url_for('r1.r1_admin_export') }}" class="admin-nav-item">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Export (CSV)
        </a>
        <a href="{{ url_for('r1.r1_admin_export_submissions') }}" class="admin-nav-item">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Submissions CSV
        </a>
      </nav>

      <div class="admin-sidebar-footer">
        <a href="{{ url_for('r1.r1_admin_logout') }}" class="btn btn-ghost btn-sm w-full">SIGN OUT</a>
      </div>
    </aside>

    <div class="admin-main">
      <header class="admin-topbar">
        <div class="flex items-center gap-md">
          <span class="badge badge-success badge-dot">ROUND 1 LIVE</span>
          <span class="font-mono text-muted" style="font-size:0.75rem;">CYBER PUZZLE 2026</span>
        </div>
        <div class="flex items-center gap-md">
          <div class="flex items-center gap-sm">
            <div class="status-dot active"></div>
            <div class="font-mono text-secondary" style="font-size:0.75rem;">ADMIN</div>
          </div>
          <a href="{{ url_for('r1.r1_admin_logout') }}" class="btn btn-subtle btn-sm" style="color:var(--text-dim);">LOGOUT</a>
        </div>
      </header>

      <div class="admin-content">
        {% block content %}{% endblock %}
      </div>
    </div>
  </div>
</body>
</html>
