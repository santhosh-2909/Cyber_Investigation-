<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Login - Cyber Puzzle</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/design-system.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/pages.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/cyber-hud.css') }}">
</head>
<body>
  <div class="pub-stage" style="display:flex;align-items:center;justify-content:center;padding:40px 20px;">

    <!-- Cinematic hacker scene (decorative background) -->
    <div class="cyber-scene" aria-hidden="true">
      <div class="cs-glows"></div>
      <div class="cs-monitor cs-monitor-l"></div>
      <div class="cs-monitor cs-monitor-r"></div>
      <div class="cs-hood"></div>
      <div class="cs-binary"></div>
      <div class="cs-overlay"></div>
    </div>

    <div class="pub-auth">
      <a href="{{ url_for('landing') }}" class="hud-nav-link hud-btn-ghost" style="display:inline-flex;margin-bottom:16px;">&larr; BACK TO MAIN PAGE</a>

      <div class="pub-auth-card">
        <div class="auth-switch">
          <a href="{{ url_for('start') }}">TEAM LOGIN</a>
          <a class="active" href="{{ url_for('r1.r1_login') }}">ROUND 1</a>
          <a href="{{ url_for('r2_login') }}">ROUND 2</a>
        </div>
        <div class="flex items-center gap-md mb-lg">
          <div class="pub-nav-logo" style="width:48px;height:48px;font-size:15px;">R1</div>
          <div>
            <div class="hud-kicker" style="color:var(--hud-dim);">ROUND 1</div>
            <h2 class="hud-h1" style="font-size:1.4rem;">Team Login</h2>
          </div>
        </div>

        {% if error %}
          <div style="background:rgba(255,176,32,0.08);border:1px solid #FFB020;padding:14px 16px;border-radius:10px;margin-bottom:20px;">
            <span class="text-warning">{{ error }}</span>
          </div>
        {% endif %}

        <form method="POST" action="{{ url_for('r1.r1_login') }}">
          <div style="margin-bottom:16px;">
            <label class="pub-label">TEAM NAME</label>
            <input type="text" name="team_name" class="pub-field" placeholder="e.g. Cyber Titans" required>
          </div>
          <div style="margin-bottom:16px;">
            <label class="pub-label">TEAM ID</label>
            <input type="text" name="team_id" class="pub-field" placeholder="e.g. TEAM-024" required>
          </div>
          <button type="submit" class="hud-btn btn-xl" style="width:100%;">LOGIN</button>
        </form>

        <p class="hud-sub" style="margin-top:16px;font-size:0.875rem;">
          Access is provisioned by the event administrator using your Team Name and Team ID.
          Any team account is provisioned in the admin console.
        </p>
      </div>
    </div>
  </div>
</body>
</html>
