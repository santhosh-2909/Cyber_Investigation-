{% extends "base.html" %}
{% block title %}Team Login - Cyber Detective{% endblock %}
{% block content %}
<div style="max-width:460px;margin:60px auto;">
    <div style="text-align:center;margin-bottom:28px;">
        <div style="font-size:56px;margin-bottom:8px;">🕵️</div>
        <h1 style="font-size:26px;">Cyber Detective</h1>
        <p class="muted" style="margin-top:6px;">Round 2 — Forensic Investigation</p>
    </div>
    <div class="card" style="padding:28px;">
        <h2 style="text-align:center;">Team Login</h2>
        {% if error %}<p style="color:var(--red);text-align:center;margin-top:10px;">{{ error }}</p>{% endif %}
        <form method="POST" action="{{ url_for('login') }}" style="margin-top:18px;">
            <div style="margin-bottom:14px;">
                <label class="muted" style="display:block;margin-bottom:6px;font-weight:600;">TEAM NAME</label>
                <input type="text" name="team_name" required placeholder="e.g. Cyber Ninjas"
                    style="width:100%;padding:12px;border-radius:8px;border:1px solid var(--border);background:var(--panel2);color:var(--text);font-size:15px;">
            </div>
            <div style="margin-bottom:14px;">
                <label class="muted" style="display:block;margin-bottom:6px;font-weight:600;">TEAM ID</label>
                <input type="text" name="team_id" required placeholder="e.g. TEAM-01"
                    style="width:100%;padding:12px;border-radius:8px;border:1px solid var(--border);background:var(--panel2);color:var(--text);font-size:15px;">
            </div>
            <div style="margin-bottom:20px;">
                <label class="muted" style="display:block;margin-bottom:6px;font-weight:600;">CAPTAIN NAME</label>
                <input type="text" name="captain" required placeholder="e.g. Alex Kumar"
                    style="width:100%;padding:12px;border-radius:8px;border:1px solid var(--border);background:var(--panel2);color:var(--text);font-size:15px;">
            </div>
            <button type="submit" class="btn" style="width:100%;padding:13px;font-size:15px;">Enter Investigation →</button>
        </form>
    </div>
    <p class="muted" style="text-align:center;margin-top:18px;font-size:13px;">You will be assigned a case automatically.</p>
</div>
{% endblock %}
