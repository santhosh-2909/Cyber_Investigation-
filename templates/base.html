<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Cyber Detective{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f1115;
            --panel: #171a22;
            --panel2: #1e2330;
            --border: #2a3040;
            --text: #e8ebf2;
            --muted: #9aa3b5;
            --accent: #4f7cff;
            --green: #2ecc71;
            --red: #ff5c5c;
            --amber: #f5b942;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }
        a { color: var(--accent); text-decoration: none; }
        .container { max-width: 1000px; margin: 0 auto; padding: 24px; }
        .nav {
            background: var(--panel);
            border-bottom: 1px solid var(--border);
            padding: 14px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .nav .brand { font-weight: 800; font-size: 18px; letter-spacing: .5px; }
        .nav .brand span { color: var(--accent); }
        .nav-links { display: flex; gap: 18px; align-items: center; }
        .nav-links a { font-size: 14px; font-weight: 600; opacity: .85; }
        .nav-links a:hover { opacity: 1; }
        .btn {
            display: inline-block;
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
        }
        .btn:hover { filter: brightness(1.1); }
        .btn.ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
        .btn.green { background: var(--green); }
        .card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 16px;
        }
        .card h2 { margin-bottom: 10px; font-size: 18px; }
        .grid { display: grid; gap: 16px; }
        .grid-2 { grid-template-columns: 1fr 1fr; }
        .muted { color: var(--muted); }
        .tag {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            background: var(--panel2);
            border: 1px solid var(--border);
        }
        .status-verified { color: var(--green); }
        .status-incorrect { color: var(--red); }
    </style>
</head>
<body>
    {% if session.get('team') %}
    <nav class="nav">
        <div class="brand">🕵️ Cyber<span>Detective</span></div>
        <div class="nav-links">
            <a href="{{ url_for('dashboard') }}">Dashboard</a>
            <a href="{{ url_for('case_study') }}">Case File</a>
            <a href="{{ url_for('evidence_board') }}">Evidence Board</a>
            <a href="{{ url_for('report') }}">Report</a>
            <a href="{{ url_for('score') }}">Score</a>
            <a href="{{ url_for('logout') }}" style="opacity:.6">Logout</a>
        </div>
    </nav>
    {% endif %}
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    {% block scripts %}{% endblock %}
</body>
</html>
